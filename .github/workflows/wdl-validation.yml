name: WDL validation

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'workflows/**/*.wdl'
      - 'scripts/*.py'
      - 'tools/check_terra_wdl.py'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'examples/**'
      - '.dockstore.yml'
      - '.github/workflows/wdl-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'workflows/**/*.wdl'
      - 'scripts/*.py'
      - 'tools/check_terra_wdl.py'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'examples/**'
      - '.dockstore.yml'
      - '.github/workflows/wdl-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check WDL 1.0
        run: miniwdl check --strict workflows/regenie.wdl
      - name: Check Terra workflow expressions
        run: python tools/check_terra_wdl.py workflows/regenie.wdl
      - name: Test CLI and command-time file localization
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download pinned Cromwell engine
        run: curl --fail --location --retry 3 --output "$RUNNER_TEMP/cromwell-87.jar" https://github.com/broadinstitute/cromwell/releases/download/87/cromwell-87.jar
      - name: Test production commands with Cromwell File localization
        env:
          CROMWELL_JAR: ${{ runner.temp }}/cromwell-87.jar
        run: python -m unittest discover -s tests -p test_cromwell.py -v
