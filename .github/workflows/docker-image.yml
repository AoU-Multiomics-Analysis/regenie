name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: 'Promote the tested image to latest'
        type: boolean
        default: false
  push:
    branches: [main, 'codex/**']
    paths:
      - 'scripts/*.py'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*.py'

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set image reference
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Build image on GitHub runner
        run: docker build --platform linux/amd64 -f envs/Dockerfile -t regenie-smoke .
      - name: Run quantitative and binary smoke tests
        run: |
          mkdir -p test-output
          docker run --rm --entrypoint /bin/bash \
            -v "$PWD/test-output:/work" -w /work regenie-smoke -c \
            'set -euo pipefail; python3 /opt/regenie/scripts/smoke_test.py --work-dir /work/smoke 2>&1 | tee /work/smoke.log'
      - name: Upload synthetic test outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regenie-synthetic-smoke
          path: test-output/
          retention-days: 7
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          AUTO_PUBLISH_LATEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          PUBLISH_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_latest }}
        run: |
          docker tag regenie-smoke "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")
          echo "Tested image: $digest" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            docker tag regenie-smoke "$IMAGE_NAME:main"
            docker push "$IMAGE_NAME:main"
          fi
          if [ "$AUTO_PUBLISH_LATEST" = 'true' ] || [ "$PUBLISH_LATEST" = 'true' ]; then
            docker tag regenie-smoke "$IMAGE_NAME:latest"
            docker push "$IMAGE_NAME:latest"
          fi
